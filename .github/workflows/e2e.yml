permissions:
  contents: read

name: E2E Tests

on:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC, full duration
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e.yml'
      - 'src/**'
      - 'tests/e2e/**'
      - 'package*.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/e2e.yml'
      - 'src/**'
      - 'tests/e2e/**'
      - 'package*.json'

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: functional
            timeout: 35
          - suite: marathon
            timeout: 75
          - suite: memory
            timeout: 45
    env:
      # Preserve full soak duration nightly; use the existing 6x scale on changes.
      TIME_SCALE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0.167' }}
      HEAP_DELTA_LIMIT_MB: '50'
      CI: 'true'
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run E2E tests
        env:
          E2E_SUITE: ${{ matrix.suite }}
          DEBUG: '1'
        run: |
          case "$E2E_SUITE" in
            functional) args=(--testPathIgnorePatterns 'marathon\.e2e\.ts|memory-stability\.e2e\.ts') ;;
            marathon) args=(--testPathPattern 'marathon\.e2e\.ts') ;;
            memory) args=(--testPathPattern 'memory-stability\.e2e\.ts') ;;
          esac
          npm run test:e2e -- "${args[@]}" --json --outputFile=e2e-results.json

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.suite }}
          path: e2e-results.json
          retention-days: 30
